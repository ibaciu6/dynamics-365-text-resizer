<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>Dynamics 365 Text Resizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 320px; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
    }

    .header {
      background: linear-gradient(135deg, #0078d4 0%, #005a9e 100%);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.2px;
    }
    .header .version {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.75;
      margin-top: 1px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #222;
      border-bottom: 1px solid #333;
    }
    .status-label { font-size: 12px; color: #aaa; }
    .status-value {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 6px rgba(76,175,80,0.5);
    }
    .status-dot.off {
      background: #757575;
      box-shadow: none;
    }

    .controls { padding: 14px 18px 6px; }
    .control-group { margin-bottom: 16px; }
    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #ccc;
    }
    .control-group label span.val {
      color: #0078d4;
      font-weight: 600;
      font-size: 12px;
      min-width: 42px;
      text-align: right;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .toggle-row span { font-size: 13px; font-weight: 500; color: #ccc; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.25s;
    }
    .slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s;
    }
    .switch input:checked + .slider { background: #0078d4; }
    .switch input:checked + .slider::before { transform: translateX(20px); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #0078d4;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0 6px;
    }
    .check-row input[type="checkbox"] {
      accent-color: #0078d4;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .check-row label { font-size: 12px; color: #aaa; cursor: pointer; }

    /* ───── Targets sections ───── */
    .targets-section { padding: 4px 18px 10px; }
    .targets-toggle {
      font-size: 11px;
      color: #777;
      cursor: pointer;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }
    .targets-toggle:hover { color: #aaa; }
    .targets-toggle .arrow { transition: transform 0.2s; font-size: 9px; }
    .targets-toggle .arrow.open { transform: rotate(90deg); }
    .targets-list {
      display: none;
      margin-top: 6px;
      padding: 8px 12px;
      background: #222;
      border-radius: 6px;
      font-size: 11px;
      color: #888;
      line-height: 1.7;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .targets-list.open { display: block; }

    /* ───── Custom fields section ───── */
    .custom-section {
      padding: 6px 18px 12px;
      border-top: 1px solid #2a2a2a;
    }
    .custom-section-title {
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 8px;
    }
    .custom-add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .custom-add-row input[type="text"] {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      color: #e8e8e8;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .custom-add-row input[type="text"]::placeholder {
      color: #666;
    }
    .custom-add-row input[type="text"]:focus {
      border-color: #0078d4;
    }
    .custom-add-row button {
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .custom-add-row button:hover { background: #005a9e; }
    .custom-add-row button:disabled {
      background: #444;
      color: #777;
      cursor: default;
    }
    .custom-fields-list {
      list-style: none;
    }
    .custom-fields-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      margin-bottom: 3px;
      background: #222;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #aaa;
    }
    .custom-fields-list li .remove-btn {
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.2s;
    }
    .custom-fields-list li .remove-btn:hover { color: #0078d4; }
    .custom-empty {
      font-size: 11px;
      color: #555;
      font-style: italic;
      padding: 2px 0;
    }

    /* ───── Footer ───── */
    .footer {
      padding: 10px 18px 14px;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .footer .reset-btn {
      font-size: 11px;
      color: #888;
      background: none;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .footer .reset-btn:hover { border-color: #0078d4; color: #0078d4; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">↕</div>
    <div>
      <h1>Dynamics 365 Text Resizer</h1>
      <div class="version"><span id="versionDisplay"></span> — Microsoft Dynamics 365</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-label">Status</span>
    <span class="status-value">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Active</span>
    </span>
  </div>

  <div class="controls">
    <div class="control-group">
      <div class="toggle-row">
        <span>Enable resizer</span>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <label>
        Minimum Height
        <span class="val" id="heightVal">180px</span>
      </label>
      <input type="range" id="minHeight" min="60" max="500" step="10" value="180">
    </div>

    <div class="check-row">
      <input type="checkbox" id="autoFit" checked>
      <label for="autoFit">Auto-fit height to content</label>
    </div>

    <div class="check-row">
      <input type="checkbox" id="showHighlight" checked>
      <label for="showHighlight">Highlight resizable fields on hover</label>
    </div>
  </div>

  <div class="targets-section">
    <button class="targets-toggle" id="targetsToggle" aria-expanded="false" aria-controls="targetsList">
      <span class="arrow" id="targetsArrow" aria-hidden="true">▶</span>
      Built-in targets
    </button>
    <div class="targets-list" id="targetsList">
      <span style="color:#0078d4;font-weight:600;font-size:10px;letter-spacing:0.5px">TEXTAREAS</span><br>
      Description<br>
      Notes<br>
      Resolution<br>
      <br>
      <span style="color:#0078d4;font-weight:600;font-size:10px;letter-spacing:0.5px">RICH-TEXT EDITORS</span><br>
      All Quill editors (.quill)
    </div>
  </div>

  <div class="custom-section">
    <div class="custom-section-title">Custom textarea fields</div>
    <div class="custom-add-row">
      <input type="text" id="customFieldInput" placeholder="Enter textarea aria-label">
      <button id="addFieldBtn" disabled>Add</button>
    </div>
    <ul class="custom-fields-list" id="customFieldsList"></ul>
    <div class="custom-empty" id="customEmpty">No custom fields added yet</div>
  </div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn">Reset Defaults</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
